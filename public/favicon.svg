<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <rect width="64" height="64" rx="14" fill="#141827"/>
  
  <!-- Scales of Justice -->
  <!-- Center pole -->
  <rect x="30.5" y="14" width="3" height="38" rx="1.5" fill="#d4a853"/>
  
  <!-- Top crossbeam -->
  <rect x="12" y="14" width="40" height="3" rx="1.5" fill="#d4a853"/>
  
  <!-- Center pin/circle -->
  <circle cx="32" cy="12" r="3.5" fill="#d4a853"/>
  
  <!-- Left pan chain -->
  <line x1="16" y1="17" x2="16" y2="28" stroke="#d4a853" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right pan chain -->
  <line x1="48" y1="17" x2="48" y2="28" stroke="#d4a853" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Left pan -->
  <path d="M9 28 Q16 34 23 28" stroke="#d4a853" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M41 28 Q48 34 55 28" stroke="#d4a853" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Base -->
  <rect x="22" y="50" width="20" height="3" rx="1.5" fill="#d4a853"/>
  <rect x="24" y="47" width="16" height="3" rx="1.5" fill="#e5c078"/>
</svg>
